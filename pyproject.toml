[project]
name = "datatagger-cli"
version = "0.1.0"
description = "Cross-platform CLI for the TUM DataTagger API — full API coverage, high-level on top of the datatagger-mcp library"
requires-python = ">=3.11"
dependencies = [
    "datatagger-mcp",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
datatagger = "datatagger_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datatagger_cli"]

[tool.uv.sources]
datatagger-mcp = { git = "https://github.com/harrytyp/datatagger-mcp" }
